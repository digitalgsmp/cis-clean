# Metadata only. The slice depends on the Python standard library and nothing
# else, by decision: determinism and cold-start recoverability are worth more
# here than any convenience a dependency would add.
[project]
name = "cis-clean"
version = "0.1.0"
description = "CIS clean-room reconstruction — vertical slice 1"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
